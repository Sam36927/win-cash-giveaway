    <div class="container" id="authContainer">
        <div class="form-toggle">
            <button class="toggle-btn active" onclick="showForm('signup')">Sign Up</button>
            <button class="toggle-btn" onclick="showForm('login')">Login</button>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" onsubmit="handleAuth(event, 'signup')">
            <div class="form-group">
                <input type="text" placeholder="Full Name" required>
            </div>
            <div class="form-group">
                <input type="email" placeholder="Email" required>
            </div>
            <div class="form-group">
                <input type="password" placeholder="Password" minlength="6" required>
            </div>
            <button type="submit">Create Account</button>
        </form>

        <!-- Login Form -->
        <form id="loginForm" class="hidden" onsubmit="handleAuth(event, 'login')">

                <input type="email" placeholder="Email" required>

                <input type="password" placeholder="Password" required>

        <div id="codeDisplay">
            <h2>🎉 Your Giveaway Entry Code 🎉</h2>

            <small>This code will be used for winner selection</small>
        </div>

    <script>
        // Mock Database (Replace with real database in production)
        let users = JSON.parse(localStorage.getItem('users')) || [];
        let currentUser = null;

        function showForm(formType) {
            document.querySelectorAll('.toggle-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('form').forEach(form => form.classList.add('hidden'));
            
            document.querySelector(`#${formType}Form`).classList.remove('hidden');
            event.currentTarget.classList.add('active');
        }

        function handleAuth(e, type) {
            e.preventDefault();
            const email = e.target[0].value;
            const password = e.target[1].value;
            const name = type === 'signup' ? e.target[0].value : null;

            if(type === 'signup') {
                if(users.some(user => user.email === email)) {
                    alert('User already exists!');
                    return;
                }
                users.push({ name, email, password });
                localStorage.setItem('users', JSON.stringify(users));
            }

            const user = users.find(u => u.email === email && u.password === password);
            if(!user) {
                alert(type === 'login' ? 'Invalid credentials!' : 'Registration failed!');
                return;
            }

            currentUser = user;
            showPaymentPage();
        }

        function showPaymentPage() {
            document.getElementById('authContainer').classList.add('hidden');
            document.getElementById('paymentContainer').classList.remove('hidden');
        }

        function initiatePayment() {
            const options = {
                key: 'YOUR_RAZORPAY_KEY', // Replace with your key
                amount: 1100, // 11 INR
                currency: 'INR',
                name: 'Giveaway Entry',
                description: 'Contest Participation Fee',
                prefill: {
                    email: currentUser.email
                },
                handler: function(response) {
                    handlePaymentSuccess(response.razorpay_payment_id);
                },
                theme: {
                    color: '#3498db'
                }
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }

        function handlePaymentSuccess(paymentId) {
            const entryCode = `GW-${paymentId.slice(-8).toUpperCase()}`;
            
            // Store entry in localStorage (Replace with DB in production)
            const entries = JSON.parse(localStorage.getItem('entries')) || [];
            entries.push({
                code: entryCode,
                paymentId,
                email: currentUser.email,
                timestamp: new Date().toISOString()
            });
            localStorage.setItem('entries', JSON.stringify(entries));

            // Show code display
            document.getElementById('paymentContainer').classList.add('hidden');
            document.getElementById('codeContainer').classList.remove('hidden');
            document.getElementById('uniqueCode').textContent = entryCode;
        }

        // Admin function for winner selection
        function selectWinner() {
            const entries = JSON.parse(localStorage.getItem('entries')) || [];
            if(entries.length === 0) return alert('No entries yet!');
            
            const winner = entries[Math.floor(Math.random() * entries.length)];
            alert(`Winner: ${winner.code}\nEmail: ${winner.email}`);
        }
    </script>
